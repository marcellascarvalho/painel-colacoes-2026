<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel das Colações 2026</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho + barra fixa de busca/abas; conteúdo em cartões por colação, lista filtrável do checklist, tabelas de apoio */
:root{
--bg:#f4f6f7; --surface:#ffffff; --surface-2:#eaf0f1; --line:#d5dee0;
--fg:#12262c; --muted:#5a6d73; --accent:#0e5a6b; --accent-ink:#ffffff; --accent-soft:#d8ecf0;
--gold:#9a6b0c; --gold-soft:#f6ead0;
--s-ver:#8a5a00; --s-ver-bg:#fbefd2;
--s-nao:#a42a2a; --s-nao-bg:#f9dede;
--s-and:#16579a; --s-and-bg:#dbe9f8;
--s-ok:#1d6b3a; --s-ok-bg:#d9efe0;
--s-ori:#4b5a60; --s-ori-bg:#e3e9eb;
--font-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
--font-b:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0d1a1e; --surface:#14262b; --surface-2:#1b3138; --line:#2a4249;
--fg:#e5eff1; --muted:#98b0b6; --accent:#5cc3d6; --accent-ink:#06242b; --accent-soft:#17414b;
--gold:#e0b45a; --gold-soft:#3a2f14;
--s-ver:#f0c76a; --s-ver-bg:#3d3114;
--s-nao:#f19a9a; --s-nao-bg:#411d1d;
--s-and:#8dbcf0; --s-and-bg:#16314f;
--s-ok:#8fd6a6; --s-ok-bg:#173723;
--s-ori:#b4c4c9; --s-ori-bg:#23363c;
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0d1a1e; --surface:#14262b; --surface-2:#1b3138; --line:#2a4249;
--fg:#e5eff1; --muted:#98b0b6; --accent:#5cc3d6; --accent-ink:#06242b; --accent-soft:#17414b;
--gold:#e0b45a; --gold-soft:#3a2f14;
--s-ver:#f0c76a; --s-ver-bg:#3d3114;
--s-nao:#f19a9a; --s-nao-bg:#411d1d;
--s-and:#8dbcf0; --s-and-bg:#16314f;
--s-ok:#8fd6a6; --s-ok-bg:#173723;
--s-ori:#b4c4c9; --s-ori-bg:#23363c;
color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.lockbox{max-width:560px;margin:12vh auto 0}
.lockbox h1{font-family:var(--font-d);font-size:30px;margin:0 0 8px}
.lrow select{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
mark{background:var(--gold-soft);color:var(--fg);border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px var(--gold)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
header.top h1{font-family:var(--font-d);font-size:clamp(26px,4.2vw,38px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.totals{display:flex;gap:10px;flex-wrap:wrap}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:104px}
.tot b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tot span{font-size:12px;color:var(--muted)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px 0;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 44px 12px 44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.search .x{position:absolute;right:8px;top:50%;translate:0 -50%;border:0;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:12px;background:var(--surface-2);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
.tab.zero .n{opacity:.55}

main{padding-top:22px}
h2{font-family:var(--font-d);font-size:22px;margin:0 0 4px}
.lead{margin:0 0 16px;color:var(--muted);max-width:75ch}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* pills */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.s-ver{color:var(--s-ver);background:var(--s-ver-bg)}
.s-nao{color:var(--s-nao);background:var(--s-nao-bg)}
.s-and{color:var(--s-and);background:var(--s-and-bg)}
.s-ok{color:var(--s-ok);background:var(--s-ok-bg)}
.s-ori{color:var(--s-ori);background:var(--s-ori-bg)}

/* colações */
.statusbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:6px 0 10px}
.statusbar i{display:block;height:100%}
.c-ver{background:var(--s-ver)}.c-nao{background:var(--s-nao)}.c-and{background:var(--s-and)}.c-ok{background:var(--s-ok)}.c-ori{background:var(--s-ori)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .k{font-variant-numeric:tabular-nums;opacity:.8;font-size:12.5px}
.overview{margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-family:var(--font-d);font-size:19px;margin:0;line-height:1.2}
.card .when{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;color:var(--muted);font-size:14px}
.card .when b{color:var(--fg);font-weight:600}
.days{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:1px 9px;border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:0 7px;margin-left:6px;font-size:12px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--fg);border-color:var(--accent)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px}
.nums div{min-width:0}
.nums b{display:block;font-family:var(--font-d);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.nums span{font-size:11.5px;color:var(--muted);line-height:1.2;display:block}
.attn{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.attn li{font-size:13.5px;padding-left:18px;position:relative}
.attn li::before{content:"!";position:absolute;left:0;top:2px;width:13px;height:13px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:10px;font-weight:700;text-align:center;line-height:13px}
.card details{font-size:13.5px;color:var(--muted)}
.card summary{cursor:pointer;color:var(--accent);font-weight:600}
.card details p{margin:8px 0 0}
.card .go{margin-top:auto;align-self:flex-start;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.card .go:hover{background:var(--accent);color:var(--accent-ink)}

/* checklist */
.filters{display:grid;gap:12px;margin-bottom:14px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow>label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:64px}
.frow select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.resbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:6px 0 10px;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:116px minmax(0,1fr) minmax(0,210px);gap:6px 16px;align-items:start}
.item .dem{margin:0;font-weight:500}
.item .meta{margin:3px 0 0;font-size:13px;color:var(--muted)}
.item .orig{margin:6px 0 0;font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.item .side{font-size:13px;color:var(--muted)}
.item .side b{color:var(--fg);font-weight:600}
.item .side div+div{margin-top:3px}
.ref{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px;display:block}
.urg{color:var(--s-nao);font-weight:600}

/* festiva */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard h4{margin:0;font-family:var(--font-d);font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fcard p{margin:0}
.fcard .obs{font-size:13.5px;color:var(--muted)}

/* tabela */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:600;background:var(--surface-2)}
.meter{height:8px;background:var(--surface-2);border-radius:99px;min-width:90px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{font-size:13px;color:var(--muted)}
.orilist{display:grid;gap:8px;max-width:85ch}
.orilist p{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}

.stsel{font:inherit;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:99px;border:1.5px solid transparent;cursor:pointer;max-width:100%;appearance:auto}
.stsel:disabled{cursor:default;opacity:1}
.stsel:not(:disabled):hover{border-color:var(--accent)}
.stsel option{background:var(--surface);color:var(--fg);font-weight:400}
.fld{display:grid;gap:2px;margin-top:8px;font-size:12px;color:var(--muted)}
.fld input{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.fld input:disabled{background:transparent;border-style:dashed}
.nota{margin-top:8px}
.sync{font-size:13.5px;padding:8px 12px;border-radius:10px;background:var(--surface-2);color:var(--muted);margin:0 0 14px}
.sync.ok{background:var(--s-ok-bg);color:var(--s-ok)}
.sync.warn{background:var(--s-ver-bg);color:var(--s-ver)}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.undo{margin-left:6px}
.login{display:grid;gap:8px}
.lrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.lrow label{display:grid;gap:2px;font-size:12px;color:var(--muted);flex:1 1 180px;min-width:0}
.lrow input{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.go2{font:inherit;font-weight:600;padding:9px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
@media (max-width:760px){
.item{grid-template-columns:minmax(0,1fr)}
.frow>label{min-width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
.card .acts .go{margin-top:0}
.card .go.pdf{background:var(--accent);color:var(--accent-ink)}
.card .go.pdf:hover{filter:brightness(1.1)}
#report{display:none}
@page{size:A4;margin:14mm}
@media print{
body>*:not(#report){display:none!important}
body{padding:0!important;background:#fff!important;color:#111!important}
body::before{display:none!important}
#report{display:block;font:10.5pt/1.4 "Figtree","Segoe UI",Arial,sans-serif;color:#111;background:#fff}
#report h1{font:700 20pt/1.15 "Bricolage Grotesque","Segoe UI",Arial,sans-serif;margin:0 0 4px;color:#0e3d4a}
#report h2{font:700 12.5pt/1.2 "Bricolage Grotesque","Segoe UI",Arial,sans-serif;margin:16px 0 6px;color:#0e3d4a;border-bottom:1.5pt solid #0e5a6b;padding-bottom:2px;break-after:avoid}
#report .sub{margin:0 0 6px;color:#444;font-size:9.5pt}
#report table{width:100%;min-width:0;border-collapse:collapse;font-size:9.5pt}
#report th,#report td{border:.5pt solid #aaa;padding:4px 6px;text-align:left;vertical-align:top;background:#fff;color:#111}
#report th{background:#e8eef0;font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em}
#report thead{display:table-header-group}
#report tr{break-inside:avoid}
#report .kv td:first-child{width:36%;font-weight:600;background:#f3f6f7}
#report .small{font-size:8.5pt;color:#555}
#report .st{font-weight:700;white-space:nowrap}
#report ul{margin:4px 0 0 18px;padding:0}
#report li{margin:2px 0}
#report p{margin:4px 0}
}
.userbar{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 12px;padding-top:12px;font-size:14px;color:var(--muted)}
.userbar b{color:var(--fg);font-weight:600}
.outbtn{font:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.outbtn:hover{background:var(--accent);color:var(--accent-ink)}

/* edição de conteúdo */
.ed{font:inherit;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;margin:6px 6px 0 0}
.ed:hover{border-color:var(--accent)}
.ed.add{border-color:var(--accent)}
.mf .ed.add{justify-self:start}
.ed.dng,.dng{color:var(--s-nao)}
h1 .ed,header p .ed,.lead .ed,.note .ed,h2 .ed,td .ed{margin:0 0 0 8px;font-size:11.5px;padding:1px 8px;vertical-align:middle}
.tbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px}
.tbar .ed{margin:0;font-size:13.5px;padding:6px 14px}
.card .acts .go.dng{border-color:var(--s-nao);color:var(--s-nao)}
.card .acts .ed.go{border-width:1.5px;border-radius:8px;padding:7px 14px;font-size:inherit;margin:0;background:transparent;color:var(--accent);border-color:var(--accent)}
.card.off,.item.off,.fcard.off,.orirow.off{opacity:.72;border-style:dashed}
.fact{display:flex;flex-wrap:wrap;gap:0 6px;margin-top:auto}
.orilist .orirow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.orilist .orirow p{margin:0;border:0;padding:0;background:none;min-width:0;overflow-wrap:anywhere}
.oact{flex:none;display:flex;flex-wrap:wrap}
.oact .ed{margin:0 0 0 6px}
body.mopen{overflow:hidden}
.mback{position:fixed;inset:0;z-index:50;background:rgba(6,20,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(680px,100%);padding:20px;display:grid;gap:14px;margin-block:auto}
.modal h2{margin:0}
.modal .note{margin:0}
.mbody{display:grid;gap:14px}
.mf{display:grid;gap:4px;min-width:0;border:0;padding:0;margin:0}
.ml{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.mh{font-size:12px;color:var(--muted)}
.mf input[type=text],.mf textarea,.mf select{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0}
.mf textarea{resize:vertical}
.mchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 12px}
.mchk label{display:flex;gap:8px;align-items:center;font-size:14px}
.mrows{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.mrow.kv3{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto auto}
.mrow.n2{grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr) auto}
.mrow .cp{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);padding-top:8px}
.mrm{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.mrm:hover{color:var(--s-nao);border-color:var(--s-nao)}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.mfoot .sp{flex:1}
.mfoot .dng{border-color:var(--s-nao)}
.merr{margin:0;font-weight:600}
@media (max-width:600px){.mrow.kv3{grid-template-columns:minmax(0,1fr) auto}.mrow.kv3 .v{grid-column:1 / -1;order:3}.mrow.n2{grid-template-columns:minmax(0,1fr) auto}.mrow.n2 .l{grid-column:1 / -1;order:3}}
</style>

<div class="wrap lockbox" id="lock"><h1>Colações de fim de ano 2026</h1>
<form class="sync warn login" id="lockform"><b>Entre com o seu nome e a sua senha para abrir o painel da equipe.</b>
<div class="lrow"><label>Seu nome<select id="kname" required></select></label>
<label>Senha<input id="kcode" type="password" autocomplete="current-password" required maxlength="40"></label>
<button class="go2" type="submit">Entrar</button></div><span class="urg" id="kerr"></span></form></div>
<div class="wrap" id="app" hidden>
<div class="userbar" id="userbar" hidden><span id="whoami"></span><button class="outbtn" type="button" data-logout="1">Sair / trocar de usuário</button></div>
<header class="top">

async function derive(pw,salt,usage){
const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

}
async function unlock(name,pw){

const wk=await derive(pw,w.s,['decrypt']);

const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},dk,b64(BLOB.c));
return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- estado compartilhado (sobreposições gravadas no banco) ---------- */
let OV = {chk:{},fes:{},ori:{},card:{},txt:{}};
let ALLCARDS=[],CARDS=[],GROUPS=[],GL={},ALLCHK=[],CHK=[],byId=new Map(),ALLFES=[],FES=[],byF=new Map(),ALLORI=[],ORI=[],byO=new Map();
const T = id => { const o=OV.txt[id]; return (o&&typeof o.d.v==='string'&&o.d.v!=='') ? o.d.v : TXT_DEF[id].v; };
const gl = k => GL[k] || k;

function ovGet(kind,id,fields,base){
const o = OV[kind][id], d = o ? o.d : {};
const x = {...base, dirty:!!o, by:o?o.by:null, at:o?o.at:null};
fields.forEach(f=>{ if(f in d && d[f]!==null) x[f]=d[f]; });
x.hid = !!x.hid;
return x;
}
const newIds = kind => Object.keys(OV[kind]).filter(k=>+k>=1000).map(Number);
const byOrd = (a,b)=>((a.ord||0)-(b.ord||0))||(a.id-b.id);

function rebuild(){
/* fichas */
const cf = ['rot','nome','quando','kv','form','cpf','inst','nums','obsT','obs','attn','capObs','hid','ord'];
const bc = BASE_CARDS.map(b=>ovGet('card',b.id,cf,b));
const nc = newIds('card').map(id=>ovGet('card',id,cf,{id,key:'n'+id,novo:true,rot:'',nome:'',quando:'',kv:[],form:null,cpf:null,inst:20,nums:[],obsT:'Observações',obs:'',attn:[],capObs:''})).sort(byOrd);
ALLCARDS = [...bc,...nc].map(c=>{ c.kv=Array.isArray(c.kv)?c.kv:[]; c.nums=Array.isArray(c.nums)?c.nums:[]; c.attn=Array.isArray(c.attn)?c.attn:[]; c.form=num(c.form); c.cpf=num(c.cpf); c.inst=num(c.inst); c.rot=c.rot||c.nome; return c; });
CARDS = ALLCARDS.filter(c=>!c.hid); GROUPS = CARDS.map(c=>c.key); GL = {}; ALLCARDS.forEach(c=>{GL[c.key]=c.rot;});
/* checklist */
const kf = ['status','resp','lim','nota','dem','prazo','cat','etapa','dt','orig','groups','hid','ord'];
const bi = BASE_CHK.map(b=>{ const it=ovGet('chk',b.l,kf,{...b,id:b.l,st0:b.status,global:/^Todas/.test(b.turma),groups:groupsOf(b.turma),resp:'',lim:'',nota:''}); it.custGroups=!!(OV.chk[b.l]&&Array.isArray(OV.chk[b.l].d.groups)); return it; });
const ni = newIds('chk').map(id=>{ const it=ovGet('chk',id,kf,{l:id,id,novo:true,turma:'',dt:'',etapa:'',cat:'',dem:'',prazo:'',status:'Não iniciado',st0:'Não iniciado',orig:null,groups:[],resp:'',lim:'',nota:''}); it.custGroups=true; return it; }).sort(byOrd);
ALLCHK = [...bi,...ni].map(it=>{
it.l = it.id; it.resp=it.resp||''; it.lim=it.lim||''; it.nota=it.nota||''; it.orig=it.orig||null; it.groups=Array.isArray(it.groups)?it.groups:[];
it.turmaLbl = (it.novo||it.custGroups) ? (it.groups.length>=GROUPS.length&&GROUPS.length>1?'Todas as colações':it.groups.map(gl).join(', ')) : short(it.turma);
it.hay = norm([it.turmaLbl,it.dt,it.etapa,it.cat,it.dem,it.prazo,it.status,it.orig,it.resp,it.nota,it.novo?'item adicionado':'linha '+it.l].join(' | '));
return it; });
CHK = ALLCHK.filter(i=>!i.hid); byId = new Map(ALLCHK.map(i=>[i.id,i]));
/* festiva */
const ff = ['tema','info','st','obs','hid','ord'];
const bf = BASE_FES.map(b=>ovGet('fes',b.id,ff,{...b,st0:b.st}));
const nf = newIds('fes').map(id=>ovGet('fes',id,ff,{id,novo:true,tema:'',info:'',st:'Pendente',st0:'Pendente',obs:''})).sort(byOrd);
ALLFES = [...bf,...nf].map(f=>{ f.hay=norm([f.tema,f.info,f.st,f.obs].join(' | ')); return f; });
FES = ALLFES.filter(f=>!f.hid); byF = new Map(ALLFES.map(f=>[f.id,f]));
/* orientações */
const of_ = ['t','hid','ord'];
const bo = BASE_ORI.map(b=>ovGet('ori',b.id,of_,b));
const no = newIds('ori').map(id=>ovGet('ori',id,of_,{id,novo:true,t:''})).sort(byOrd);
ALLORI = [...bo,...no].map(o=>{ o.hay=norm(o.t); return o; });
ORI = ALLORI.filter(o=>!o.hid); byO = new Map(ALLORI.map(o=>[o.id,o]));
if(S.group!=='Todas' && !GROUPS.includes(S.group)) S.group='Todas';
}
function calc(c){
const conv = (isNum(c.form)&&isNum(c.cpf)) ? c.form*c.cpf : null;
const fc = isNum(c.form) ? c.form+(conv||0) : null;
const capt = fc!=null ? fc+(isNum(c.inst)?c.inst:0) : null;
return {conv,fc,capt};
}

/* ---------- estado da tela ---------- */
const S = {tab:'colacoes', q:'', group:'Todas', status:'Todos', cat:'Todas', urg:false, sort:'planilha', trash:false};
const TABS = [['colacoes','Colações'],['checklist','Checklist'],['festiva','Festiva Medicina'],['capacidade','Capacidade'],['orientacoes','Orientações']];

/* ---------- filtros ---------- */
const chkPool = () => S.trash ? ALLCHK.filter(i=>i.hid) : CHK;
function filterChk(ignore){
return chkPool().filter(it=>
matches(it.hay) &&
(ignore==='group' || S.group==='Todas' || it.groups.includes(S.group)) &&
(ignore==='status' || S.status==='Todos' || it.status===S.status) &&
(S.cat==='Todas' || it.cat===S.cat) &&
(!S.urg || isUrg(it)));
}
const filtFes = () => (S.trash?ALLFES.filter(f=>f.hid):FES).filter(x=>matches(x.hay));
const filtOri = () => (S.trash?ALLORI.filter(o=>o.hid):ORI).filter(x=>matches(x.hay));
function capRows(){
const rows = CARDS.map(c=>{ const k=calc(c); return {a:c.capNome||c.nome,b:c.quando,c:c.form,d:c.cpf,e:k.conv,f:c.inst,g:k.capt,h:c.capObs}; });
const w = CARDS.filter(c=>isNum(c.form)); const ks = w.map(calc);
const sum = a => a.reduce((s,x)=>s+(x||0),0);
const total = {a:'TOTAL — colações com formandos informados',b:null,c:sum(w.map(c=>c.form)),d:'—',e:sum(ks.map(k=>k.conv)),f:sum(w.map(c=>c.inst)),g:sum(ks.map(k=>k.capt)),h:T(12),total:true};
return [...rows,total].map(r=>({...r,hay:norm([r.a,r.b,r.c,r.d,r.e,r.f,r.g,r.h].join(' | '))}));
}
const filtCap = () => capRows().filter(x=>matches(x.hay));

/* ---------- renderização ---------- */
const ED = () => !!(CAN && DB);
const edBtn = (act,k,id,label,cls) => ED() ? `<button type="button" class="ed ${cls||''}" data-act="${act}" data-k="${k}" data-id="${id}">${label}</button>` : '';
const txtBtn = id => ED() ? ` <button type="button" class="ed" data-act="txt" data-id="${id}">editar texto</button>` : '';
function trashBar(kind, n, addLabel){
const add = ED()&&!S.trash ? `<button type="button" class="ed add" data-act="new" data-k="${kind}">+ ${addLabel}</button>` : '';

return `<div class="tbar">${add}${tr}</div>`;
}

const t = [[CARDS.reduce((s,c)=>s+(c.form||0),0),'possíveis formandos'],

function renderTabs(){
const cnt = {
colacoes: CARDS.filter(cardMatch).length,
checklist: CHK.filter(i=>matches(i.hay)).length,

$('#tabs').innerHTML = TABS.map(([k,l])=>

function cardHay(c){
const k = calc(c);
return norm([c.nome,c.rot,c.quando,c.kv.map(r=>r.k+' '+r.v).join(' '),c.nums.map(n=>n.v+' '+n.l).join(' '),c.form,c.cpf,k.conv,k.fc,k.capt,c.obs,c.attn.join(' '),c.capObs].join(' | '));
}
const cardMatch = c => !terms.length || matches(cardHay(c));

function copyBtn(v){return `<button class="copy" data-copy="${esc(v)}" aria-label="Copiar">copiar</button>`}
function daysTo(str){
const m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(str||''); if(!m) return '';
const d = new Date(+m[3], +m[2]-1, +m[1]); const n = new Date(); n.setHours(0,0,0,0);
const diff = Math.round((d-n)/864e5);
return diff>1 ? `em ${diff} dias` : diff===1 ? 'amanhã' : diff===0 ? 'hoje' : 'já ocorreu';
}

<div class="note">${items.length} itens: ${segs.filter(s=>s.n).map(s=>s.n+' '+s.k.toLowerCase()).join(' · ')}</div></div>`;
}
const whoLine = (x,verb) => x.dirty ? `<p class="ref">${esc(verb||'Alterado')} por ${esc(who(x.by))} em ${fmtAt(x.at)}</p>` : '';
function renderCard(c){
const k = calc(c);
const days = daysTo(c.quando);
const when = `<b>${hl(c.quando)}</b>${days?`<span class="days">${days}</span>`:''}`;
const kv = c.kv.length ? `<dl class="kv">${c.kv.map(r=>{ const v=String(r.v??''); const empty=!v||/^(—|não informado)$/i.test(v);
return `<dt>${hl(r.k)}</dt><dd>${empty ? (v?`<span class="note">${hl(v)}</span>`:'—') : hl(v)+(r.c?copyBtn(v):'')}</dd>`; }).join('')}</dl>` : '';
const boxes = [];
if(isNum(c.form)) boxes.push([fmt(c.form),'formandos'],[fmt(c.cpf),'convites por formando'],[fmt(k.conv),'convites estimados'],[fmt(k.fc),'formandos + convites']);
c.nums.forEach(n=>boxes.push([n.v,n.l]));
const nums = (boxes.length ? `<div class="nums">${boxes.map(([a,b])=>`<div><b>${hl(a)}</b><span>${hl(b)}</span></div>`).join('')}</div>` : '')
+ (k.capt!=null ? `<div class="note">Capacidade estimada com ${fmt(c.inst||0)} convidados institucionais: <b>${fmt(k.capt)}</b> pessoas.</div>` : '');
const full = c.obs ? `<details><summary>${esc(c.obsT||'Observações')}</summary><p>${hl(c.obs)}</p></details>` : '';

return `<article class="card"><h3>${hl(c.nome)}</h3><div class="when">${when}</div>${kv}${nums}${attn}${miniStatus(c.key)}${full}${whoLine(c,c.novo?'Criada/alterada':'Editada')}
<div class="acts"><button class="go" data-go="${esc(c.key)}">Ver checklist desta colação</button><button class="go pdf" data-pdf="${esc(c.key)}">Gerar PDF da colação</button>${edBtn('edit','card',c.id,'Editar ficha','go')}</div></article>`;
}

<div class="acts">${edBtn('restore','card',c.id,'Restaurar','go')}${c.novo?edBtn('purge','card',c.id,'Excluir definitivamente','go dng'):''}</div></article>`;

(cs.length ? `<div class="cards">${cs.map(renderCard).join('')}</div>` : '<div class="empty">Nenhuma ficha de colação corresponde à busca. Veja as outras abas: os números ao lado de cada aba mostram onde há resultados.</div>');

function vChecklist(){

const cats = Object.keys(catCounts).filter(Boolean).sort((a,b)=>a.localeCompare(b,'pt'));
const gBase = filterChk('group'), sBase = filterChk('status');

}
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtAt = at => { try{return new Date(at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return ''} };
const who = n => n || 'um colega';

function festSt(s){
const t = norm(s);
if(/andamento/.test(t)) return 'and';
if(/nao aprovada|nao calcular/.test(t)) return 'nao';
if(/pendente|verificar|confirmar|nao validada|conferir/.test(t)) return 'ver';
if(/^(confirmado|aprovad)/.test(t)) return 'ok';
return 'ori';
}
function vFestiva(){
const f = filtFes(); const nTr = ALLFES.filter(x=>x.hid).length;
return `<h2>${S.trash?'Alinhamentos removidos':esc(T(2))+txtBtn(2)}</h2>

const listRow = x => `<div class="mrow"><textarea rows="2">${esc(x)}</textarea><button type="button" class="mrm" data-mrm="1" aria-label="Remover linha">×</button></div>`;

function fieldHtml(f,v){
const L = `<span class="ml">${esc(f.l)}</span>`, H = f.h ? `<span class="mh">${esc(f.h)}</span>` : '';
if(f.t==='text'||f.t==='num') return `<label class="mf">${L}<input name="${f.n}" type="text" ${f.t==='num'?'inputmode="decimal"':''} value="${esc(v??'')}" ${f.list?`list="dl_${f.n}"`:''} autocomplete="off">${f.list?`<datalist id="dl_${f.n}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}${H}</label>`;
if(f.t==='area') return `<label class="mf">${L}<textarea name="${f.n}" rows="${f.rows||3}">${esc(v??'')}</textarea>${H}</label>`;
if(f.t==='select') return `<label class="mf">${L}<select name="${f.n}">${f.opts.map(o=>`<option value="${esc(o.v)}" ${o.v===v?'selected':''}>${esc(o.l)}</option>`).join('')}</select>${H}</label>`;
if(f.t==='checks') return `<fieldset class="mf"><legend class="ml">${esc(f.l)}</legend><div class="mchk">${f.opts.map(o=>`<label><input type="checkbox" name="${f.n}" value="${esc(o.v)}" ${(v||[]).includes(o.v)?'checked':''}> ${esc(o.l)}</label>`).join('')}</div>${H}</fieldset>`;
return `<div class="mf" data-list="${f.n}" data-lt="${f.t}">${L}<div class="mrows">${(v||[]).map(ROWS[f.t]).join('')}</div><button type="button" class="ed add" data-madd="1">+ Adicionar</button>${H}</div>`;
}
function normVals(fields,src){
const o={};
fields.forEach(f=>{ const v=src[f.n];
if(f.t==='text'||f.t==='area'||f.t==='select') o[f.n]=v==null?'':v;
else if(f.t==='num') o[f.n]=num(v);
else if(f.t==='checks'||f.t==='list') o[f.n]=Array.isArray(v)?[...v]:[];
else if(f.t==='kv') o[f.n]=(Array.isArray(v)?v:[]).map(r=>({k:r.k||'',v:r.v||'',c:r.c?1:0}));
else if(f.t==='nums') o[f.n]=(Array.isArray(v)?v:[]).map(r=>({v:String(r.v??''),l:r.l||''}));
});
return o;
}
function collect(root,fields){
const out={};
fields.forEach(f=>{
const q = sel => root.querySelector(sel);
if(f.t==='text'||f.t==='area'||f.t==='select') out[f.n]=q(`[name="${f.n}"]`).value.trim();
else if(f.t==='num') out[f.n]=q(`[name="${f.n}"]`).value.trim();
else if(f.t==='checks') out[f.n]=[...root.querySelectorAll(`input[name="${f.n}"]:checked`)].map(x=>x.value);
else { const rows=[...q(`[data-list="${f.n}"]`).querySelectorAll('.mrow')];
if(f.t==='list') out[f.n]=rows.map(r=>r.querySelector('textarea').value.trim()).filter(Boolean);
if(f.t==='kv') out[f.n]=rows.map(r=>({k:r.querySelector('.k').value.trim(),v:r.querySelector('.v').value.trim(),c:r.querySelector('.c').checked?1:0})).filter(r=>r.k||r.v);
if(f.t==='nums') out[f.n]=rows.map(r=>({v:r.querySelector('.v').value.trim(),l:r.querySelector('.l').value.trim()})).filter(r=>r.v||r.l);
}
});
return out;
}

function submitForm(){
const cfg = MCFG; if(!cfg) return;
const raw = collect($('#modal form'), cfg.fields);
for(const f of cfg.fields){
if(f.req && !String(raw[f.n]).trim()) return formError('Preencha: '+f.l+'.');
if(f.reqArr && !raw[f.n].length) return formError('Escolha pelo menos uma opção em: '+f.l+'.');
if(f.t==='num' && raw[f.n]!=='' && num(raw[f.n])===null) return formError('Número inválido em: '+f.l+'.');
}
const vals = {}; cfg.fields.forEach(f=>{ vals[f.n] = f.t==='num' ? num(raw[f.n]) : raw[f.n]; });
const diff = {}; cfg.fields.forEach(f=>{ if(JSON.stringify(vals[f.n])!==JSON.stringify(cfg.vals[f.n])) diff[f.n]=vals[f.n]; });
closeForm();
cfg.onSave(diff, vals);
}

async function createCard(v){
const {cp,...doc} = v; const id = newId('card'); const key = 'n'+id; const ts = Date.now();
let src = [];
if(cp==='std') src = stdItems();
else if(cp.startsWith('src:')) src = CHK.filter(i=>i.groups.includes(cp.slice(4)));
await patch('card',id,{...doc,novo:1,ord:ts});
if(!src.length) { toast('Colação criada.'); return; }
const used = new Set(); inflight++; saveSeq++;
try{
const itens = src.map((i,n)=>({chave:'chk:'+newId('chk',used),dados:{novo:1,dem:i.dem,cat:i.cat,etapa:i.etapa,prazo:i.prazo,dt:doc.quando||'',orig:i.orig||'',groups:[key],status:'Não iniciado',ord:ts+n+1}}));
for(let a=0;a<itens.length;a+=100) await rpc('colacoes_salvar_lote',{p_nome:MYID,p_senha:CODE,p_itens:itens.slice(a,a+100)});
toast('Colação criada com '+itens.length+' itens no checklist.');
}catch(e){ toast('A ficha foi criada, mas não foi possível copiar o checklist. Tente adicionar os itens manualmente.'); }
finally{ inflight--; lastSig=''; poll(); }
}

}
function act(a,k,id){
if(a==='edit') return editRec(k,id);
if(a==='new') return newRec(k);
if(a==='txt') return editTxt(+id);
if(a==='trash'){ S.trash=!S.trash; return render(); }
if(a==='restore') return patch(k,+id,{hid:false});
if(a==='reset') return resetKey(k,+id);
if(a==='purge'){ if(confirm('Excluir de vez? Isso não pode ser desfeito.')) hardDelete(k,+id); return; }
}

/* ---------- eventos ---------- */
$('#q').addEventListener('input', e=>{S.q=e.target.value; render();});
$('#clearq').addEventListener('click', ()=>{S.q='';$('#q').value='';render();$('#q').focus();});
document.addEventListener('click', e=>{
const b = e.target.closest('button'); if(!b) return;
if(b.dataset.mclose) return closeForm();
if(b.dataset.mx!==undefined){ const x=MCFG&&MCFG.extra[+b.dataset.mx]; if(x) x.fn(); return; }
if(b.dataset.mrm){ b.closest('.mrow').remove(); return; }
if(b.dataset.madd){ const box=b.closest('[data-list]'), t=box.dataset.lt; const rows=box.querySelector('.mrows'); rows.insertAdjacentHTML('beforeend',ROWS[t](EMPTY[t])); const f=rows.lastElementChild.querySelector('input:not([type=checkbox]),textarea'); if(f) f.focus(); return; }
if(b.dataset.act) return act(b.dataset.act,b.dataset.k,b.dataset.id);
if(b.dataset.tab) return setTab(b.dataset.tab);
if(b.dataset.group!==undefined){S.group=b.dataset.group;return render();}
if(b.dataset.status!==undefined){S.status=b.dataset.status;return render();}
if(b.dataset.urg){S.urg=!S.urg;return render();}
if(b.dataset.reset){Object.assign(S,{group:'Todas',status:'Todos',cat:'Todas',urg:false,q:''});$('#q').value='';return render();}
if(b.dataset.go){Object.assign(S,{group:b.dataset.go,status:'Todos',cat:'Todas',urg:false});setTab('checklist');return window.scrollTo({top:0});}
if(b.dataset.statusGo){Object.assign(S,{group:'Todas',status:b.dataset.statusGo,cat:'Todas',urg:false});setTab('checklist');return window.scrollTo({top:0});}
if(b.dataset.pdf){const c=CARDS.find(x=>x.key===b.dataset.pdf); if(c) printReport(c); return;}
if(b.dataset.copy){
const v=b.dataset.copy, done=()=>{b.textContent='copiado';setTimeout(()=>b.textContent='copiar',1400)};
(navigator.clipboard&&navigator.clipboard.writeText(v).then(done).catch(()=>fallback(v,done)))||fallback(v,done);
}
});
function fallback(v,done){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){}t.remove();}
document.addEventListener('change', e=>{
const t = e.target; if(t.closest && t.closest('#modal')) return;
if(t.dataset && t.dataset.l && t.dataset.f){ const it=byId.get(+t.dataset.l); if(it) saveChk(it,t.dataset.f,t.value.trim?t.value.trim():t.value); return; }
if(t.dataset && t.dataset.fi){ const f=byF.get(+t.dataset.fi); if(f) saveFes(f,t.value); return; }
if(t.id==='cat'){S.cat=t.value;render();}
if(t.id==='sort'){S.sort=t.value;render();}
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && MCFG) closeForm(); });
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){S.tab=h;S.trash=false;render();}});
{const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)) S.tab=h;}

/* ---------- edição compartilhada (banco) ---------- */
let DB=null, CAN=false, MYID='', CODE='', LOGIN_ERR='', SYNC='off', pending=false, lastSig='', pollT=null, saveSeq=0, inflight=0, lastRows=[];
const Q={};
const SB_URL='https://xhidcbfjdyrompxubrha.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoaWRjYmZqZHlyb21weHVicmhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzAxMTMsImV4cCI6MjEwMTcwNjExM30.yHLmSd5k2qYYIPiu3QPkFdSx-z8uOID5c4RJySXZ1iA';
function syncNote(){
if(SYNC==='loading') return '<p class="sync">Conectando para carregar as alterações dos colegas…</p>';
if(!DB) return `<p class="sync warn">${esc(LOGIN_ERR||'Sem conexão com o banco no momento.')} <button class="linkbtn" data-logout="1">Entrar de novo</button></p>`;
return `<p class="sync ok">Edição compartilhada ativa como <b>${esc(MYID)}</b>. Status, textos e itens podem ser editados; tudo é salvo na hora e registra quem alterou. As mudanças dos colegas chegam em alguns segundos. <button class="linkbtn" data-logout="1">Sair</button></p>`;
}
let toastT; function toast(m){let el=$('#toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);} el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true},4500);}
function softRender(){const a=document.activeElement; if(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){pending=true;return;} render();}
document.addEventListener('focusout',()=>{ if(pending){pending=false; setTimeout(render,0);} });
const queue=(k,fn)=>{ Q[k]=(Q[k]||Promise.resolve()).then(fn,fn); return Q[k]; };

const ls = {get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
async function rpc(fn, body){
const r = await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
if(!r.ok){ let m=''; try{m=(await r.json()).message||''}catch(e){} const e=new Error(m||('http '+r.status)); e.code=m; throw e; }
const t=await r.text(); return t?JSON.parse(t):null;
}
function applyRows(rows){
lastRows = rows; OV = {chk:{},fes:{},ori:{},card:{},txt:{}};
rows.forEach(r=>{ const p=String(r.chave).split(':'); if(OV[p[0]]) OV[p[0]][p[1]]={d:r.dados||{},by:r.autor,at:r.atualizado_em}; });
rebuild();
}
function patch(kind,id,fields,opt){
if(!ED()) return Promise.resolve();
const key=kind+':'+id, cur=OV[kind][id];
OV[kind][id]={d:{...(cur?cur.d:{}),...fields},by:MYID,at:new Date().toISOString()};
rebuild(); if(!(opt&&opt.norender)) render();
saveSeq++; inflight++;
return queue(key,()=>rpc('colacoes_mesclar',{p_nome:MYID,p_senha:CODE,p_chave:key,p_dados:fields}))
.catch(()=>{ toast('Não foi possível salvar. A alteração foi desfeita.'); applyRows(lastRows); render(); })
.finally(()=>{ inflight--; if(!inflight){ lastSig=''; poll(); } });
}
function resetKey(kind,id){
if(!ED()) return Promise.resolve();
const key=kind+':'+id;
delete OV[kind][id]; rebuild(); render();
saveSeq++; inflight++;
return queue(key,()=>rpc('colacoes_apagar',{p_nome:MYID,p_senha:CODE,p_chave:key}))
.catch(()=>{ toast('Não foi possível concluir. Tente de novo.'); })
.finally(()=>{ inflight--; lastSig=''; poll(); });
}
const hardDelete = resetKey;
function saveChk(it, field, val){
if(!ED()||it[field]===val) return;
patch('chk',it.l,{[field]:val},{norender: field!=='status'});
}
function saveFes(f,val){ if(!ED()||f.st===val) return; patch('fes',f.id,{st:val}); }
async function poll(){
if(!CODE||inflight) return; const s0=saveSeq;
try{
const rows = await rpc('colacoes_ler',{p_nome:MYID,p_senha:CODE});
if(saveSeq!==s0||inflight) return;
const sig = JSON.stringify(rows);
if(sig===lastSig) return; lastSig=sig;
applyRows(rows); softRender();
}catch(e){ if(e.code==='codigo_invalido') logout('Seu acesso foi alterado ou desativado. Entre de novo.'); }
}
function startPolling(){ clearInterval(pollT); pollT=setInterval(()=>{ if(!document.hidden) poll(); },12000); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && DB) poll(); });
async function login(name, code){
SYNC='loading'; LOGIN_ERR=''; render();
try{
CODE=code.trim(); MYID=name.trim();
await rpc('colacoes_ler',{p_nome:MYID,p_senha:CODE});
ls.set('col_code',CODE);
DB=true; CAN=true; SYNC='on'; lastSig='';
await poll(); render(); startPolling();
}catch(e){
DB=null; CAN=false; SYNC='off';
LOGIN_ERR = e.code==='codigo_invalido' ? 'Senha incorreta ou acesso desativado.' : 'Não foi possível conectar agora. Tente de novo em instantes.';
if(e.code==='codigo_invalido') ls.del('col_code');
render();
}
}
function logout(msg){
ls.del('col_code'); if(!msg){ location.reload(); return; }
clearInterval(pollT); DB=null; CAN=false; SYNC='off'; CODE=''; lastSig=''; ls.del('col_code'); LOGIN_ERR=msg||'';
closeForm(); OV={chk:{},fes:{},ori:{},card:{},txt:{}}; rebuild();
render();
}
document.addEventListener('submit',e=>{
if(e.target.closest && e.target.closest('#modal')){ e.preventDefault(); submitForm(); return; }
if(e.target.id==='login'){ e.preventDefault(); login($('#lname').value,$('#lcode').value); }
});
document.addEventListener('click',e=>{ if(e.target.closest('[data-logout]')) logout(''); });
MYID = NAME0;
rebuild();
render();
login(NAME0, CODE0);

};
