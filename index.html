<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel das Colações 2026</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho + barra fixa de busca/abas; conteúdo em cartões por colação, lista filtrável do checklist, tabelas de apoio */
:root{
--bg:#f4f6f7; --surface:#ffffff; --surface-2:#eaf0f1; --line:#d5dee0;
--fg:#12262c; --muted:#5a6d73; --accent:#0e5a6b; --accent-ink:#ffffff; --accent-soft:#d8ecf0;
--gold:#9a6b0c; --gold-soft:#f6ead0;
--s-ver:#8a5a00; --s-ver-bg:#fbefd2;
--s-nao:#a42a2a; --s-nao-bg:#f9dede;
--s-and:#16579a; --s-and-bg:#dbe9f8;
--s-ok:#1d6b3a; --s-ok-bg:#d9efe0;
--s-ori:#4b5a60; --s-ori-bg:#e3e9eb;
--font-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
--font-b:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0d1a1e; --surface:#14262b; --surface-2:#1b3138; --line:#2a4249;
--fg:#e5eff1; --muted:#98b0b6; --accent:#5cc3d6; --accent-ink:#06242b; --accent-soft:#17414b;
--gold:#e0b45a; --gold-soft:#3a2f14;
--s-ver:#f0c76a; --s-ver-bg:#3d3114;
--s-nao:#f19a9a; --s-nao-bg:#411d1d;
--s-and:#8dbcf0; --s-and-bg:#16314f;
--s-ok:#8fd6a6; --s-ok-bg:#173723;
--s-ori:#b4c4c9; --s-ori-bg:#23363c;
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0d1a1e; --surface:#14262b; --surface-2:#1b3138; --line:#2a4249;
--fg:#e5eff1; --muted:#98b0b6; --accent:#5cc3d6; --accent-ink:#06242b; --accent-soft:#17414b;
--gold:#e0b45a; --gold-soft:#3a2f14;
--s-ver:#f0c76a; --s-ver-bg:#3d3114;
--s-nao:#f19a9a; --s-nao-bg:#411d1d;
--s-and:#8dbcf0; --s-and-bg:#16314f;
--s-ok:#8fd6a6; --s-ok-bg:#173723;
--s-ori:#b4c4c9; --s-ori-bg:#23363c;
color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.lockbox{max-width:560px;margin:12vh auto 0}
.lockbox h1{font-family:var(--font-d);font-size:30px;margin:0 0 8px}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
mark{background:var(--gold-soft);color:var(--fg);border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px var(--gold)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
header.top h1{font-family:var(--font-d);font-size:clamp(26px,4.2vw,38px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.totals{display:flex;gap:10px;flex-wrap:wrap}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:104px}
.tot b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tot span{font-size:12px;color:var(--muted)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px 0;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 44px 12px 44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.search .x{position:absolute;right:8px;top:50%;translate:0 -50%;border:0;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:12px;background:var(--surface-2);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
.tab.zero .n{opacity:.55}

main{padding-top:22px}
h2{font-family:var(--font-d);font-size:22px;margin:0 0 4px}
.lead{margin:0 0 16px;color:var(--muted);max-width:75ch}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* pills */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.s-ver{color:var(--s-ver);background:var(--s-ver-bg)}
.s-nao{color:var(--s-nao);background:var(--s-nao-bg)}
.s-and{color:var(--s-and);background:var(--s-and-bg)}
.s-ok{color:var(--s-ok);background:var(--s-ok-bg)}
.s-ori{color:var(--s-ori);background:var(--s-ori-bg)}

/* colações */
.statusbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:6px 0 10px}
.statusbar i{display:block;height:100%}
.c-ver{background:var(--s-ver)}.c-nao{background:var(--s-nao)}.c-and{background:var(--s-and)}.c-ok{background:var(--s-ok)}.c-ori{background:var(--s-ori)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .k{font-variant-numeric:tabular-nums;opacity:.8;font-size:12.5px}
.overview{margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-family:var(--font-d);font-size:19px;margin:0;line-height:1.2}
.card .when{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;color:var(--muted);font-size:14px}
.card .when b{color:var(--fg);font-weight:600}
.days{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:1px 9px;border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:0 7px;margin-left:6px;font-size:12px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--fg);border-color:var(--accent)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px}
.nums div{min-width:0}
.nums b{display:block;font-family:var(--font-d);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.nums span{font-size:11.5px;color:var(--muted);line-height:1.2;display:block}
.attn{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.attn li{font-size:13.5px;padding-left:18px;position:relative}
.attn li::before{content:"!";position:absolute;left:0;top:2px;width:13px;height:13px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:10px;font-weight:700;text-align:center;line-height:13px}
.card details{font-size:13.5px;color:var(--muted)}
.card summary{cursor:pointer;color:var(--accent);font-weight:600}
.card details p{margin:8px 0 0}
.card .go{margin-top:auto;align-self:flex-start;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.card .go:hover{background:var(--accent);color:var(--accent-ink)}

/* checklist */
.filters{display:grid;gap:12px;margin-bottom:14px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow>label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:64px}
.frow select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.resbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:6px 0 10px;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:116px minmax(0,1fr) minmax(0,210px);gap:6px 16px;align-items:start}
.item .dem{margin:0;font-weight:500}
.item .meta{margin:3px 0 0;font-size:13px;color:var(--muted)}
.item .orig{margin:6px 0 0;font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.item .side{font-size:13px;color:var(--muted)}
.item .side b{color:var(--fg);font-weight:600}
.item .side div+div{margin-top:3px}
.ref{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px;display:block}
.urg{color:var(--s-nao);font-weight:600}

/* festiva */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard h4{margin:0;font-family:var(--font-d);font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fcard p{margin:0}
.fcard .obs{font-size:13.5px;color:var(--muted)}

/* tabela */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:600;background:var(--surface-2)}
.meter{height:8px;background:var(--surface-2);border-radius:99px;min-width:90px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{font-size:13px;color:var(--muted)}
.orilist{display:grid;gap:8px;max-width:85ch}
.orilist p{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}

.stsel{font:inherit;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:99px;border:1.5px solid transparent;cursor:pointer;max-width:100%;appearance:auto}
.stsel:disabled{cursor:default;opacity:1}
.stsel:not(:disabled):hover{border-color:var(--accent)}
.stsel option{background:var(--surface);color:var(--fg);font-weight:400}
.fld{display:grid;gap:2px;margin-top:8px;font-size:12px;color:var(--muted)}
.fld input{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.fld input:disabled{background:transparent;border-style:dashed}
.nota{margin-top:8px}
.sync{font-size:13.5px;padding:8px 12px;border-radius:10px;background:var(--surface-2);color:var(--muted);margin:0 0 14px}
.sync.ok{background:var(--s-ok-bg);color:var(--s-ok)}
.sync.warn{background:var(--s-ver-bg);color:var(--s-ver)}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.undo{margin-left:6px}
.login{display:grid;gap:8px}
.lrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.lrow label{display:grid;gap:2px;font-size:12px;color:var(--muted);flex:1 1 180px;min-width:0}
.lrow input{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.go2{font:inherit;font-weight:600;padding:9px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
@media (max-width:760px){
.item{grid-template-columns:minmax(0,1fr)}
.nums{grid-template-columns:repeat(2,1fr)}
.frow>label{min-width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap lockbox" id="lock"><h1>Colações de fim de ano 2026</h1>
<form class="sync warn login" id="lockform"><b>Digite o código de acesso para abrir o painel da equipe.</b>
<div class="lrow"><label>Seu nome<input id="kname" autocomplete="name" required maxlength="60"></label>
<label>Código de acesso<input id="kcode" autocomplete="off" required maxlength="40"></label>
<button class="go2" type="submit">Entrar</button></div><span class="urg" id="kerr"></span></form></div>
<div class="wrap" id="app" hidden>
<header class="top">
<div>
<h1>Colações de fim de ano 2026</h1>
<p>Todas as informações da planilha de acompanhamento em um só lugar. Digite na busca para encontrar qualquer nome, data, fornecedor ou pendência.</p>
</div>
<div class="totals" id="totals"></div>
</header>

<div class="bar">
<div class="search">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="q" type="search" autocomplete="off" placeholder="Buscar: Sericol, jardineira, Luiz Felipe, Expominas, discurso, canudo…" aria-label="Buscar em todo o painel">
<button class="x" id="clearq" aria-label="Limpar busca" hidden>×</button>
</div>
<div class="tabs" role="tablist" id="tabs"></div>
</div>

<main id="view" aria-live="polite"></main>
</div>

async function unlock(code){
const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim()),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));
return JSON.parse(new TextDecoder().decode(pt));
}

<script>

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ACC = {a:'aàáâãä',e:'eèéêë',i:'iìíîï',o:'oòóôõö',u:'uùúûü',c:'cç',n:'nñ'};
const reEsc = c => /[.*+?^${}()|[\]\\]/.test(c) ? '\\'+c : c;
function termRe(t){return [...t].map(c=>{const l=c.toLowerCase();return ACC[l]?'['+ACC[l]+ACC[l].toUpperCase()+']':reEsc(c)}).join('')}
let terms = [];
function hl(text){
const t = String(text ?? '');
if(!terms.length) return esc(t);
const re = new RegExp('('+terms.map(termRe).join('|')+')','gi');
return t.split(re).map((p,i)=> i%2 ? '<mark>'+esc(p)+'</mark>' : esc(p)).join('');
}
const matches = hay => terms.every(t => hay.includes(t));
const short = s => String(s||'').replace(/ \(2º\/2026\)/g,'');
const fmt = n => (n==null||n==='' ) ? '—' : (typeof n==='number' ? n.toLocaleString('pt-BR') : n);

/* ---------- dados derivados ---------- */
const GROUPS = ['Fisioterapia','Enfermagem','Psicologia','Medicina manhã','Medicina tarde','Medicina festiva'];
function groupsOf(t){
t = t||'';
if(/^Todas/.test(t)) return [...GROUPS];
const g = new Set();
if(t.includes('Fisioterapia')) g.add('Fisioterapia');
if(t.includes('Enfermagem')) g.add('Enfermagem');
if(t.includes('Psicologia')) g.add('Psicologia');
if(t.includes('Medicina')){
const fest = t.includes('festiva'), man = t.includes('manhã'), tar = t.includes('tarde'), ofi = t.includes('oficial');
if(fest) g.add('Medicina festiva');
if(man) g.add('Medicina manhã');
if(tar) g.add('Medicina tarde');
if(ofi){g.add('Medicina manhã');g.add('Medicina tarde');}
if(!fest&&!man&&!tar&&!ofi){g.add('Medicina manhã');g.add('Medicina tarde');g.add('Medicina festiva');}
}

}
const STATUS = [

];

const FES_OPTS = ['Confirmado','Pendente','Em andamento','Aprovado','Não aprovada','A verificar'];
function festSt(s){
const t = norm(s);
if(/andamento/.test(t)) return 'and';
if(/nao aprovada|nao calcular/.test(t)) return 'nao';
if(/pendente|verificar|confirmar|nao validada|conferir/.test(t)) return 'ver';
if(/^(confirmado|aprovad)/.test(t)) return 'ok';
return 'ori';
}

const queue=(k,fn)=>{ Q[k]=(Q[k]||Promise.resolve()).then(fn,fn); return Q[k]; };

function saveChk(it, field, val){
if(!DB||!CAN) return;

const doc={status:it.status,resp:it.resp,lim:it.lim,nota:it.nota,...stamp()};

if(field==='status') render();
}
function saveFes(f,val){
if(!DB||!CAN||f.st===val) return;
f.st=val; f.dirty=true; f.by=MYID; f.at=new Date().toISOString(); rehayF(f);
queue('f'+f.i,()=>DB.doc('fes/r'+f.i).set({st:val,...stamp()})).catch(()=>{toast('Não foi possível salvar. A alteração foi desfeita.'); if(lastFes) applyFes(lastFes); render();});

}
function applyChk(snap){

Object.assign(it,{status:v.status||it.st0,resp:v.resp||'',lim:v.lim||'',nota:v.nota||'',by:v.by||null,at:v.at||null,dirty:true}); rehay(it); });

}
function applyFes(snap){

async function rpc(fn, body){
const r = await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
if(!r.ok){ let m=''; try{m=(await r.json()).message||''}catch(e){} const e=new Error(m||('http '+r.status)); e.code=m; throw e; }
const t=await r.text(); return t?JSON.parse(t):null;
}
const keyOf = path => { const [col,id]=path.split('/'); return col+':'+id.replace(/^[lr]/,''); };
const dbAdapter = {doc:path=>({
set:d=>rpc('colacoes_salvar',{p_codigo:CODE,p_chave:keyOf(path),p_dados:d,p_autor:MYID}),

})};
async function poll(){
if(!CODE) return;
try{
const rows = await rpc('colacoes_ler',{p_codigo:CODE});
const sig = JSON.stringify(rows);
if(sig===lastSig) return; lastSig=sig;
const mk=(pre,letter)=>({docs:rows.filter(r=>r.chave.startsWith(pre+':')).map(r=>({id:letter+r.chave.split(':')[1],data:()=>({...r.dados,by:r.autor,at:r.atualizado_em})}))});
applyChk(mk('chk','l')); applyFes(mk('fes','r')); softRender();

}

FES.forEach(f=>{ if(f.dirty){Object.assign(f,{st:f.st0,by:null,at:null,dirty:false}); rehayF(f);} });
